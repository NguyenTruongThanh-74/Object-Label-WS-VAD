seed: 42
device: cuda

bclip:
  repo: external/B-CLIP
  checkpoint: external/B-CLIP/model/bclip_checkpoint.pth
  model_name: CLIP_VITB16_OPENAI
  context_length: 248
  global_pool: ""   # keep patch tokens for β-CLIP conditioned pooling
  attn_fn: softmax
  attn_fn_alpha: 1.0
  text_conditioning_mode: attn_pooling_mlp
  use_text_conditioned_cls: false

sam2:
  model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
  checkpoint: external/sam2/checkpoints/sam2.1_hiera_large.pt
  cache_dir: data/sam2_cache
  segmentation_dir: data/sam2_masks
  max_objects: 8
  points_per_side: 24
  pred_iou_thresh: 0.7
  stability_score_thresh: 0.88
  min_mask_region_area: 128
  min_mask_area_ratio: 0.001
  max_mask_area_ratio: 0.8
  object_text_templates:
    - "a CCTV video frame containing {object}"
    - "a surveillance camera view of {object}"
    - "a video frame showing {object} during an incident"
  object_vocabulary:
    - {name: pedestrian, class_id: null}
    - {name: person, class_id: null}
    - {name: bicycle, class_id: null}
    - {name: vehicle, class_id: null}
    - {name: crowd, class_id: null}
    - {name: bag, class_id: null}
    - {name: gun, class_id: null}
    - {name: knife, class_id: null}
    - {name: fire, class_id: null}
    - {name: smoke, class_id: null}
    - {name: explosion, class_id: null}
    - {name: fight, class_id: null}
    - {name: collision, class_id: null}

prompt:
  object_tokens: 1
  action_tokens: 2
  place_tokens: 2
  where_tokens: 2
  init_std: 0.02
  anchor_dim: 512
  anchor_scale_init: 1.0
  learnable_anchor_scale: true
  use_object_residual: true
  normalize_anchor_before_projection: true

model:
  mode: conditioned   # conditioned | global
  freeze_bclip: true
  temperature_from_bclip: true
  video_branch_weight: 1.0
  anomaly_class_ids: [1]
  anomaly_topk: 1

data:
  root: .
  train_csv: data/train.csv
  val_csv: data/val.csv
  classes_json: data/classes.binary.example.json
  anchors_npy: data/anchors.binary.example.npy
  image_size: 224
  frames_per_video: 8
  inference_frame_chunk_size: 32
  object_dim: 512
  require_sam2_cache: true
  num_workers: 2

train:
  epochs: 20
  batch_size: 16
  lr_prompt: 0.0005
  lr_video_branch: 0.0005
  lr_conditioner: 0.00005
  weight_decay: 0.0001
  train_conditioner: false
  anchor_loss_weight: 0.05
  object_loss_weight: 0.1
  video_branch_loss_weight: 1.0
  anomaly_loss_weight: 1.0
  anomaly_sparsity_weight: 0.05
  normal_frame_loss_weight: 0.1
  normal_object_loss_weight: 0.1
  hierarchy_loss_weight: 0.1
  amp: true
  output_dir: outputs
